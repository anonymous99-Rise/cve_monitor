name: Version Bump

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/**'
      - 'archive/**'
      - 'static/**'
      - 'RSS/**'
      - 'data.db'
      - 'index.html'
  workflow_dispatch:

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: get_version
        shell: bash
        run: |
          current_version=$(grep -oP "VERSION = '\K[^']+" CVE_monitor.py)
          echo "Current version: $current_version"
          echo "current_version=$current_version" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        shell: bash
        run: |
          current_version=${{ steps.get_version.outputs.current_version }}

          if [[ $current_version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            new_patch=$((patch + 1))
            new_version="$major.$minor.$new_patch"
          else
            new_version="2.3.3"
          fi

          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Update version in files
        shell: bash
        run: |
          new_version=${{ steps.bump_version.outputs.new_version }}
          current_date=$(date +'%Y-%m-%d')

          sed -i "s/VERSION = '[0-9]\+\.[0-9]\+\.[0-9]\+'/VERSION = '$new_version'/" CVE_monitor.py

          sed -i "s/当前版本：\*\*[^*]\+\*\*/当前版本：\*\*v$new_version\*\*/" README.md || true
          sed -i "s/版本更新时间：[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}/版本更新时间：$current_date/" README.md || true

      - name: Check if tag exists
        id: check_tag
        shell: bash
        run: |
          if git rev-parse --verify "${{ steps.bump_version.outputs.new_version }}" 2>/dev/null; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bump version to ${{ steps.bump_version.outputs.new_version }}"
          tagging_message: "${{ steps.bump_version.outputs.new_version }}"
          push_options: --force-with-lease

      - name: Create GitHub Release
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.new_version }}
          name: ${{ steps.bump_version.outputs.new_version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
